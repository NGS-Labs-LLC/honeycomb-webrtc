# Builds LiveKitWebRTC.xcframework from the pins in PINS (honeycomb-ios D82), twice on fresh
# runners, and compares the two builds. A pull request that changes the pipeline runs it; so does
# a manual dispatch. A tag `build-*` also publishes a release whose notes carry the zip's sha256
# and BUILD-RECORD. Nothing here holds a secret: the release uses this repository's GITHUB_TOKEN.
name: Build

on:
  workflow_dispatch:
  pull_request:
    paths: [PINS, build.sh, patches/**, .github/workflows/build.yml]
  push:
    tags: ['build-*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: LiveKitWebRTC, build ${{ matrix.attempt }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          . ./PINS
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Free disk
        run: |
          df -h /
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Build
        run: |
          set -o pipefail
          mkdir -p logs
          # The full output goes to the artifact; the job log shows the stages and disk use.
          OUT="$PWD/out" ./build.sh 2>&1 | tee logs/build.log \
            | grep --line-buffered -E "^build.sh:|^::(group|endgroup)::|Filesystem|/dev/|error:" \
            || { tail -200 logs/build.log; exit 1; }
          cat out/BUILD-RECORD

      - name: Upload the framework and its record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.attempt }}
          path: |
            out
            logs
          retention-days: 14

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
      - name: Compare
        # Reports only: byte-for-byte reproducibility is measured here, not yet claimed (D82 3.5).
        run: |
          for i in 1 2; do grep -E '^(ZIP_SHA256|BINARY_SHA256|HEADER_SHA256)' "build-$i/out/BUILD-RECORD" > "$i.txt"; done
          echo "Files that differ between the two builds:"
          diff build-1/out/MANIFEST.sha256 build-2/out/MANIFEST.sha256 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if diff -u 1.txt 2.txt; then
            echo "REPRODUCIBLE: both builds have the same zip, slices and header" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT REPRODUCIBLE: the builds differ (above)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/build-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-1
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_sum=$(sha256sum out/LiveKitWebRTC.xcframework.zip | cut -d' ' -f1)
          record_sum=$(sha256sum out/BUILD-RECORD | cut -d' ' -f1)
          manifest_sum=$(sha256sum out/MANIFEST.sha256 | cut -d' ' -f1)
          grep -q "^ZIP_SHA256=$zip_sum$" out/BUILD-RECORD
          {
            echo "| Asset | sha256 |"
            echo "|---|---|"
            echo "| \`LiveKitWebRTC.xcframework.zip\` | \`$zip_sum\` |"
            echo "| \`BUILD-RECORD\` | \`$record_sum\` |"
            echo "| \`MANIFEST.sha256\` | \`$manifest_sum\` |"
            echo
            echo "Built from webrtc-sdk/webrtc \`$(grep '^WEBRTC_COMMIT=' out/BUILD-RECORD | cut -d= -f2)\` with \`./build.sh\`."
            echo
            echo '```'
            cat out/BUILD-RECORD
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/LiveKitWebRTC.xcframework.zip out/BUILD-RECORD out/MANIFEST.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
