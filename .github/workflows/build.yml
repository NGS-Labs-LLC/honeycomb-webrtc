# Builds LiveKitWebRTC.xcframework from the pins in PINS (honeycomb-ios D82), twice on fresh
# runners, and compares the two builds. A pull request that changes the pipeline runs it (that is
# how D82 3.5's reproducibility is measured); so does a manual dispatch. A tag `build-*` also
# publishes a release, but only when the two builds are reproducible (SEC WEBRTC-03:
# scripts/compare-builds.sh, the same slices, header, resolved set and files, Info.plist excluded)
# and the record's pins match PINS at the tag. Its notes carry every asset's sha256, both builds'
# hashes, the comparison's verdict and BUILD-RECORD.
# Nothing here holds a secret: the release uses this repository's GITHUB_TOKEN.
name: Build

on:
  workflow_dispatch:
  pull_request:
    paths: [PINS, build.sh, patches/**, scripts/**, tests/**, .github/workflows/build.yml]
  push:
    tags: ['build-*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-patch:
    # Minutes, on Linux: the WebRTC patch applies to the pinned commit with every hash as listed,
    # the tests it adds pass (api/crypto/frame_replay_guard_unittest.cc: the bounds, no reset
    # while the key lives, retired ssrcs, the key-index report), and the replay guard passes
    # hive-node's frame_replay vectors.
    name: WebRTC source patch, its tests and replay vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install googletest
        run: sudo apt-get install -y -q libgtest-dev
      - name: Patch the pinned WebRTC files and run the patch's tests and the replay vectors
        run: |
          . ./PINS
          git init -q webrtc
          git -C webrtc sparse-checkout set --no-cone /api/crypto/ /api/webrtc_sdp.cc /media/engine/webrtc_voice_engine.cc '/sdk/objc/api/peerconnection/RTCFrameCryptor*'
          git -C webrtc fetch -q --depth 1 --filter=blob:none "$WEBRTC_REPO" "$WEBRTC_COMMIT"
          git -C webrtc checkout -q FETCH_HEAD
          [ "$(git -C webrtc rev-parse HEAD)" = "$WEBRTC_COMMIT" ]
          patches/apply-webrtc-patch.sh "$PWD/webrtc"
          # The patch's own gtest file, as WebRTC's crypto_unittests would build it; test/gtest.h
          # is WebRTC's wrapper around googletest, so a one-line stand-in serves here.
          mkdir -p shim/test && echo '#include <gtest/gtest.h>' > shim/test/gtest.h
          g++ -std=c++20 -Wall -Wextra -Werror -I webrtc -I shim -o frame_replay_guard_unittest \
            webrtc/api/crypto/frame_replay_guard_unittest.cc -lgtest -lgtest_main -pthread
          ./frame_replay_guard_unittest
          g++ -std=c++20 -Wall -Wextra -Werror -I webrtc -o frame_replay_guard_test tests/frame_replay_guard_test.cc
          ./frame_replay_guard_test tests/frame_replay.vectors

  compare-gate:
    # Seconds, on Linux: the release gate (SEC WEBRTC-03) passes identical builds and builds that
    # differ only in their Info.plist files, and fails any other difference.
    name: The two-build comparison's gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test scripts/compare-builds.sh
        run: tests/compare-builds-test.sh

  build:
    name: LiveKitWebRTC, build ${{ matrix.attempt }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          . ./PINS
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -qx "Build version $XCODE_BUILD"

      - name: Free disk
        run: |
          df -h /
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Build
        run: |
          set -o pipefail
          mkdir -p logs
          # The full output goes to the artifact; the job log shows the stages and disk use.
          OUT="$PWD/out" ./build.sh 2>&1 | tee logs/build.log \
            | grep --line-buffered -E "^build.sh:|^::(group|endgroup)::|Filesystem|/dev/|error:" \
            || { tail -200 logs/build.log; exit 1; }
          cat out/BUILD-RECORD

      - name: Upload the framework and its record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.attempt }}
          path: |
            out
            logs
          retention-days: 14

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
      - name: Compare
        # The gate (SEC WEBRTC-03, D82 3.5): every slice and the key-provider header the same, the
        # resolved dependency set the same, and every other file the same but the Info.plist files,
        # which carry the build machine's macOS build. It fails otherwise, and the release, which
        # needs this job, doesn't run. COMPARE carries the verdict and both builds' hashes.
        run: |
          mkdir -p compare
          set +e
          tag/scripts/compare-builds.sh build-1 build-2 compare/COMPARE
          status=$?
          set -e
          head -1 compare/COMPARE >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Kept when the builds differ too, so the verdict and its diffs can be read.
        if: always()
        with:
          name: compare
          path: compare
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/build-')
    # Only reproducible builds are published (SEC WEBRTC-03): compare fails otherwise.
    needs: [build, compare, compare-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: tag
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compare
          path: compare
      - name: Check the record against PINS at the tag
        run: |
          . tag/PINS
          record=out/BUILD-RECORD
          want() { grep -qx "$1" "$record" || { echo "BUILD-RECORD does not say $1"; exit 1; }; }
          want "COMMIT=$GITHUB_SHA"
          want "WEBRTC_COMMIT=$WEBRTC_COMMIT"
          want "WEBRTC_BUILD_COMMIT=$WEBRTC_BUILD_COMMIT"
          want "DEPOT_TOOLS_COMMIT=$DEPOT_TOOLS_COMMIT"
          want "XCODE_BUILD=$XCODE_BUILD"
          want "CATALYST_XCODE_BUILD=$CATALYST_XCODE_BUILD"
          want "PATCH_SHA256=$(sha256sum tag/patches/webrtc-build-m150.7871.04.patch | cut -d' ' -f1)"
          want "WEBRTC_PATCH_SHA256=$(sha256sum tag/patches/webrtc-a545de4.patch | cut -d' ' -f1)"
          grep -q "^XCODE=Xcode $XCODE_VERSION Build version $XCODE_BUILD " "$record"
          grep -q "^CATALYST_XCODE=.*Build version $CATALYST_XCODE_BUILD " "$record"
          grep -q "^RESOLVED_SHA256=$(sha256sum out/RESOLVED | cut -d' ' -f1) " "$record"
          echo "BUILD-RECORD matches PINS and the patches at $GITHUB_SHA"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_sum=$(sha256sum out/LiveKitWebRTC.xcframework.zip | cut -d' ' -f1)
          record_sum=$(sha256sum out/BUILD-RECORD | cut -d' ' -f1)
          manifest_sum=$(sha256sum out/MANIFEST.sha256 | cut -d' ' -f1)
          resolved_sum=$(sha256sum out/RESOLVED | cut -d' ' -f1)
          compare_sum=$(sha256sum compare/COMPARE | cut -d' ' -f1)
          grep -q "^ZIP_SHA256=$zip_sum$" out/BUILD-RECORD
          {
            echo "| Asset | sha256 |"
            echo "|---|---|"
            echo "| \`LiveKitWebRTC.xcframework.zip\` | \`$zip_sum\` |"
            echo "| \`BUILD-RECORD\` | \`$record_sum\` |"
            echo "| \`MANIFEST.sha256\` | \`$manifest_sum\` |"
            echo "| \`RESOLVED\` | \`$resolved_sum\` |"
            echo "| \`COMPARE\` | \`$compare_sum\` |"
            echo
            echo "Built from webrtc-sdk/webrtc \`$(grep '^WEBRTC_COMMIT=' out/BUILD-RECORD | cut -d= -f2)\` with \`./build.sh\` at \`$GITHUB_SHA\`. The zip is build 1's."
            echo
            echo "**Two-build comparison (this run):** $(head -1 compare/COMPARE)"
            echo
            echo '```'
            cat compare/COMPARE
            echo '```'
            echo
            echo '```'
            cat out/BUILD-RECORD
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/LiveKitWebRTC.xcframework.zip out/BUILD-RECORD out/MANIFEST.sha256 \
            out/RESOLVED compare/COMPARE \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
